<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chapolín Canario · Pantalla TV</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:#09151f;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#dce8f4}
/* ── ESPERA ── */
#wait{position:fixed;inset:0;background:#09151f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.wt{font-family:'Oswald',sans-serif;font-size:3.6rem;color:#fff;font-weight:700;letter-spacing:2px}
.wt span{color:#f5a623}
.wcode{font-family:'Oswald',sans-serif;font-size:3.8rem;color:#f5a623;font-weight:900;letter-spacing:12px}
.wqr{background:#fff;padding:14px;border-radius:10px;border:4px solid #f5a623}
.wsub{font-size:.9rem;color:#3a6080;letter-spacing:1px}
/* ── JUEGO ── */
#game{width:100%;height:100vh;display:none;flex-direction:column;padding-top:1cm}
/* TOP */
.topbar{display:flex;align-items:center;background:#050c14;padding:0;height:160px;flex-shrink:0;border-bottom:1px solid #0d1e2e;margin-bottom:0.5cm}
.tt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 10px;text-align:center}
.ttn{font-size:clamp(22px,2.2vw,38px);text-transform:uppercase;letter-spacing:2px;color:#4a85b8;font-weight:700}
.ttp{font-family:'Oswald',sans-serif;font-size:clamp(72px,8vw,120px);font-weight:900;line-height:1}
.tt.loc .ttp{color:#5badff}
.tt.vis{align-items:center}
.tt.vis .ttp{color:#f5a623}
.topmid{flex:1;text-align:center;display:flex;align-items:center;justify-content:center}
.tmsets{font-family:'Oswald',sans-serif;font-size:clamp(68px,8vw,120px);font-weight:700;color:#fff;letter-spacing:4px}
/* MAIN */
.main{display:flex;flex:1;overflow:hidden}
/* CARDS cuadradas */
.pc{flex:0 0 33.33%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 10px 8px;border:3px solid transparent;transition:background .3s}
.la{background:#ecf4ff;border-color:#1d6fe8}
.la .pn,.la .pscore{color:#0d3d96}
.la .si.w{background:#0d3d96;box-shadow:0 0 8px rgba(13,61,150,.5)}
.la .si.e{background:rgba(13,61,150,.12);border:1px solid rgba(13,61,150,.25)}
.li{background:#07152e;border-color:#0a1828}
.li .pn,.li .pscore{color:#fff}
.li .si.w{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.4)}
.li .si.e{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.va{background:#f5c800;border-color:#c7a000}
.va .pn,.va .pscore{color:#0d3d96}
.va .si.w{background:#0d3d96;box-shadow:0 0 8px rgba(13,61,150,.5)}
.va .si.e{background:rgba(13,61,150,.12);border:1px solid rgba(13,61,150,.25)}
.vi{background:#07152e;border-color:#0a1828}
.vi .pn,.vi .pscore{color:#f5c842}
.vi .si.w{background:#f5c842;box-shadow:0 0 6px rgba(245,200,66,.5)}
.vi .si.e{background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.2)}
.pn{font-family:'Oswald',sans-serif;font-size:clamp(22px,2.5vw,46px);font-weight:900;text-transform:uppercase;letter-spacing:1px;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psets{display:flex;gap:7px;margin:4px 0}
.si{width:38px;height:12px;border-radius:6px;transition:all .3s}
.pscore{font-family:'Oswald',sans-serif;font-size:clamp(80px,13.5vw,220px);font-weight:900;line-height:1;flex:1;display:flex;align-items:center;justify-content:center}
.pballs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:28px;padding:2px 0}
/* BALL PANEL central – ocupa todo el espacio restante, triángulo */
.bpanel{flex:0 0 33.33%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1828;padding:10px 6px;gap:0;border-left:1px solid #040a10;border-right:1px solid #040a10}
.bpr{display:flex;gap:6px;align-items:center}
/* BOTTOM TIMER */
#bottom-bar{height:110px;background:#04070e;border-top:2px solid rgba(255,255,255,.04);flex-shrink:0;position:relative;display:flex;align-items:center;padding:8px 10px}
#pausa-lbl{display:none;position:absolute;inset:0;pointer-events:none;z-index:10}
#pausa-lbl.vis{display:block}
#pausa-cv{width:100%;height:100%;display:block}
#seg-bar{width:100%;height:82px;display:flex;align-items:flex-end;gap:2px}
.seg{flex:1;border-radius:3px 3px 2px 2px}
.seg.c0{background:#dd2020;box-shadow:0 0 4px rgba(221,32,32,.5)}
.seg.c1{background:#e06010;box-shadow:0 0 4px rgba(224,96,16,.4)}
.seg.c2{background:#e0a000;box-shadow:0 0 4px rgba(224,160,0,.4)}
.seg.c3{background:#84cc16;box-shadow:0 0 4px rgba(132,204,22,.4)}
.seg.c4{background:#1eaa3a;box-shadow:0 0 4px rgba(30,170,58,.4)}
.seg.off{background:#0c1820;box-shadow:none;opacity:.28}
.credit{position:absolute;bottom:114px;right:16px;font-size:11px;color:rgba(60,100,140,.28)}
#tv-ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:800;display:none;align-items:center;justify-content:center}
#tv-ov-inner{text-align:center;padding:clamp(20px,3vw,50px) clamp(30px,5vw,80px);background:#0d1c2e;border-radius:24px;border:3px solid #1d3a58;min-width:min(500px,80vw);box-shadow:0 0 60px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="wait">
  <div class="wt">Chapolín <span>Canario</span></div>
  <div class="wcode" id="wcode">------</div>
  <div class="wqr" id="qrbox"></div>
  <div class="wsub">Escanea con el móvil para controlar el marcador</div>
</div>
<div id="tv-ov"><div id="tv-ov-inner"></div></div>
<div id="game">
  <div class="topbar">
    <div class="tt loc">
      <div class="ttn" id="tv-ln">Equipo Local</div>
      <div class="ttp" id="tv-lp">0</div>
    </div>
    <div class="topmid">
      <div class="tmsets" id="tv-sets">0 - 0</div>
    </div>
    <div class="tt vis">
      <div class="ttn" id="tv-vn">Equipo Visitante</div>
      <div class="ttp" id="tv-vp">0</div>
    </div>
  </div>
  <div class="main">
    <div class="pc la" id="tv-pc0">
      <div class="pn" id="tv-pn0">JUGADOR A</div>
      <div class="psets" id="tv-ps0"></div>
      <div class="pscore" id="tv-sc0">0</div>
      <div class="pballs" id="tv-pb0"></div>
    </div>
    <div class="bpanel" id="tv-balls"></div>
    <div class="pc vi" id="tv-pc1">
      <div class="pn" id="tv-pn1">JUGADOR B</div>
      <div class="psets" id="tv-ps1"></div>
      <div class="pscore" id="tv-sc1">0</div>
      <div class="pballs" id="tv-pb1"></div>
    </div>
  </div>
  <div class="credit">tenerife3bandas.com</div>
  <div id="bottom-bar">
    <div id="pausa-lbl"><canvas id="pausa-cv"></canvas></div>
    <div id="seg-bar"></div>
  </div>
</div>
<script>
var BDATA=[
  {id:'B',v:10,color:'#e0eaf8',s2:'#b0c8e0',isW:true},
  {id:1,v:1,color:'#f0c800',s2:'#c09800'},
  {id:2,v:2,color:'#1255d4',s2:'#0a3490'},
  {id:3,v:3,color:'#cc1a1a',s2:'#880e0e'},
  {id:4,v:4,color:'#7020cc',s2:'#4a0e90'},
  {id:5,v:5,color:'#e05800',s2:'#a03800'},
  {id:6,v:6,color:'#157a30',s2:'#0a4a1c'},
  {id:7,v:7,color:'#8a0000',s2:'#5a0000'},
  {id:8,v:8,color:'#181818',s2:'#080808'},
  {id:9,v:9,color:'#f0c800',s2:'#c09800',stripe:true},
  {id:10,v:10,color:'#1255d4',s2:'#0a3490',stripe:true},
  {id:11,v:11,color:'#cc1a1a',s2:'#880e0e',stripe:true},
  {id:12,v:12,color:'#7020cc',s2:'#4a0e90',stripe:true},
  {id:13,v:13,color:'#e05800',s2:'#a03800',stripe:true},
  {id:14,v:14,color:'#157a30',s2:'#0a4a1c',stripe:true},
  {id:15,v:15,color:'#8a0000',s2:'#5a0000',stripe:true}
];
var TRIANGLE=[[2,11,12,10,3],[9,13,14,8],[7,15,6],[4,5],[1],['B']];
var buid=0;
function makeBall(id,sz,av,lite){
  var b=BDATA.find(function(x){return String(x.id)===String(id);});
  if(!b)return '';
  var u=++buid,r=sz/2-1.5,cx=sz/2,cy=sz/2;
  var op=av?1:.13;
  var o='<svg width="'+sz+'" height="'+sz+'" style="display:block;flex-shrink:0;opacity:'+op+'">';
  o+='<defs>';
  if(b.isW){
    o+='<radialGradient id="g'+u+'" cx="38%" cy="32%" r="58%"><stop offset="0%" stop-color="#ffffff"/><stop offset="52%" stop-color="#d8e8f4"/><stop offset="100%" stop-color="#88aac8"/></radialGradient>';
  }else{
    o+='<radialGradient id="g'+u+'" cx="38%" cy="32%" r="62%" fx="34%" fy="27%"><stop offset="0%" stop-color="'+lighten(b.color,.55)+'"/><stop offset="42%" stop-color="'+b.color+'"/><stop offset="100%" stop-color="'+darken(b.color,.60)+'"/></radialGradient>';
  }
  o+='<radialGradient id="hl'+u+'" cx="38%" cy="30%" r="52%" fx="34%" fy="24%"><stop offset="0%" stop-color="rgba(255,255,255,.90)"/><stop offset="32%" stop-color="rgba(255,255,255,.38)"/><stop offset="62%" stop-color="rgba(255,255,255,.05)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></radialGradient>';
  o+='<radialGradient id="h2'+u+'" cx="38%" cy="26%" r="17%"><stop offset="0%" stop-color="rgba(255,255,255,1)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></radialGradient>';
  if(!lite)o+='<radialGradient id="sh'+u+'" cx="64%" cy="70%" r="54%"><stop offset="0%" stop-color="rgba(0,0,0,.50)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient>';
  if(b.stripe)o+='<clipPath id="cl'+u+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/></clipPath>';
  if(!lite)o+='<filter id="ds'+u+'" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="'+(r*.14)+'" stdDeviation="'+(r*.15)+'" flood-color="rgba(0,0,0,.80)"/></filter>';
  o+='</defs>';
  o+='<g'+(lite?'':' filter="url(#ds'+u+')"')+'>';
  if(b.isW){
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#g'+u+')" stroke="rgba(0,0,0,.15)" stroke-width=".8"/>';
  }else if(b.stripe){
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="white" stroke="rgba(0,0,0,.22)" stroke-width=".7"/>';
    o+='<rect x="0" y="'+(cy-r*.92/2)+'" width="'+sz+'" height="'+(r*.92)+'" fill="url(#g'+u+')" clip-path="url(#cl'+u+')"/>';
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.44)+'" fill="white"/>';
  }else{
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#g'+u+')" stroke="rgba(0,0,0,.28)" stroke-width=".7"/>';
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.44)+'" fill="white"/>';
  }
  if(!lite)o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#sh'+u+')" />';
  o+='</g>';
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#hl'+u+')"/>';
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#h2'+u+')"/>';
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(0,0,0,.28)" stroke-width=".7"/>';
  if(!b.isW){
    o+='<text x="'+cx+'" y="'+(cy+sz*.03)+'" text-anchor="middle" dominant-baseline="central" font-size="'+(sz*.34)+'" font-weight="300" fill="#111" font-family="\'Helvetica Neue\',Helvetica,Arial,sans-serif" style="pointer-events:none;user-select:none">'+b.id+'</text>';
  }
  o+='</svg>';
  return o;
}
function lighten(h,f){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return'rgb('+(Math.min(255,r+Math.round((255-r)*f)))+','+(Math.min(255,g+Math.round((255-g)*f)))+','+(Math.min(255,b+Math.round((255-b)*f)))+')'}
function darken(h,f){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return'rgb('+(Math.round(r*(1-f)))+','+(Math.round(g*(1-f)))+','+(Math.round(b*(1-f)))+')'}

/* ── TIMER ── */
(function(){
  var bar=document.getElementById('seg-bar');
  for(var i=0;i<40;i++){
    var d=document.createElement('div');d.id='tvs'+i;
    d.className='seg '+(i<8?'c0':i<16?'c1':i<24?'c2':i<32?'c3':'c4');
    d.style.height='100%';bar.appendChild(d);
  }
})();
function renderSegs(rem,total){
  var N=40,apag=Math.round(((total-Math.max(rem,0))/total)*N);
  for(var i=0;i<N;i++){
    var el=document.getElementById('tvs'+i);if(!el)continue;
    if((N-1-i)<apag){el.className='seg off';el.style.height='20%';}
    else{el.className='seg '+(i<8?'c0':i<16?'c1':i<24?'c2':i<32?'c3':'c4');el.style.height='100%';}
  }
}
var tvPaused=true;
function dibujarPausa(){
  var bar=document.getElementById('bottom-bar'),cv=document.getElementById('pausa-cv');
  if(!cv||!bar)return;
  var W=bar.offsetWidth,H=bar.offsetHeight;if(W<10||H<10)return;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  var fs=Math.round(H*.52);
  ctx.font='900 italic '+fs+'px "Oswald",sans-serif';
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  var txt='PAUSA',tm=ctx.measureText(txt);
  var capH=tm.actualBoundingBoxAscent+tm.actualBoundingBoxDescent;
  var midY=H/2,bH=capH,bW=capH*.26,bGap=capH*.18,iconW=bW*2+bGap,gapIT=capH*.38;
  var sx=(W-(iconW+gapIT+tm.width))/2;
  ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=14;
  ctx.fillStyle='rgba(255,255,255,.97)';
  ctx.fillRect(sx,midY-bH/2,bW,bH);ctx.fillRect(sx+bW+bGap,midY-bH/2,bW,bH);
  ctx.fillText(txt,sx+iconW+gapIT,midY+capH/2-tm.actualBoundingBoxDescent);
  ctx.shadowBlur=0;
}
window.addEventListener('resize',function(){if(tvPaused)dibujarPausa();});
window.addEventListener('resize',function(){var av=document.getElementById('tv-balls');if(av&&av.children.length)buildBalls((window._lastAvail||[]))});
function setTimer(rem,paused,total){
  renderSegs(rem,total);tvPaused=paused;
  var pl=document.getElementById('pausa-lbl');
  if(paused){pl.className='vis';dibujarPausa();}else pl.className='';
}

var tvBallSz=54;
function buildBalls(avail){
  var panel=document.getElementById('tv-balls');
  var pw=panel.offsetWidth||300;
  var ph=panel.offsetHeight||600;
  var maxRow=5;
  // Width-based: 5 balls + 4 gaps (sz*0.12) + 40px padding → sz*(5+0.48)+40 = pw → sz=(pw-40)/5.48
  var sz_w=Math.floor((pw-40)/5.48);
  // Height-based: 6 rows + 5 row-gaps (sz*0.12) + white-ball top margin (sz*0.35) + panel padding(20)
  // sz*6.95 + 20 = ph → sz=(ph-20)/6.95
  var sz_h=Math.floor((ph-30)/6.95);
  var sz=Math.min(sz_w,sz_h,160);
  sz=Math.max(sz,30);
  tvBallSz=sz;
  var gap=Math.floor(sz*.12);
  document.getElementById('tv-balls').innerHTML=TRIANGLE.map(function(row,ri){
    var isB=row.length===1&&String(row[0])==='B';
    var mt=isB?Math.floor(sz*.35)+'px':'0px';
    var cells=row.map(function(id){
      var av=avail.indexOf(String(id))>=0;
      return makeBall(id,sz,av);
    }).join('');
    return '<div class="bpr" style="gap:'+gap+'px;margin-top:'+mt+'">'+cells+'</div>';
  }).join('');
}

/* ── RENDER ── */
function render(st){
  if(!st||!st.config||!st.game)return;
  var cfg=st.config,g=st.game;
  try{
    document.getElementById('tv-ln').textContent=cfg.teams[0].name;
    document.getElementById('tv-vn').textContent=cfg.teams[1].name;
    document.getElementById('tv-lp').textContent=cfg.teams[0].pts;
    document.getElementById('tv-vp').textContent=cfg.teams[1].pts;
    document.getElementById('tv-sets').textContent=g.setsW[0]+' - '+g.setsW[1];
    for(var i=0;i<2;i++){
      var isL=i===0,act=g.act===i;
      document.getElementById('tv-pc'+i).className='pc '+(isL?(act?'la':'li'):(act?'va':'vi'));
      var pi=g.selPl[i];
      var pname=(pi!=null&&cfg.teams[i].players[pi])?cfg.teams[i].players[pi].name:'--';
      document.getElementById('tv-pn'+i).textContent=pname.toUpperCase();
      document.getElementById('tv-sc'+i).textContent=g.scores[i];
      var mto=cfg.mTO||3,tol=g.toLft?g.toLft[i]:mto;
      var sh='';for(var d=0;d<mto;d++)sh+='<div class="si '+(d<tol?'w':'e')+'"></div>';
      document.getElementById('tv-ps'+i).innerHTML=sh;
      document.getElementById('tv-pb'+i).innerHTML=(g.pock[i]||[]).map(function(b){return makeBall(b.id,tvBallSz||54,true,true);}).join('');
    }
    buildBalls((g.avail||[]).map(function(b){return String(b.id);}));
    window._lastAvail=(g.avail||[]).map(function(b){return String(b.id);});
    setTimer(g.tmr?g.tmr.rem:cfg.tSec,!g.tmr||!g.tmr.on,cfg.tSec);
  }catch(e){console.warn('render error:',e);}
  /* El overlay de TV se controla exclusivamente por mensajes dedicados sendOv() */
}
function showTvOverlay(ov){
  var tvOv=document.getElementById('tv-ov');
  if(!tvOv)return;
  if(!ov){tvOv.style.display='none';return;}
  var inner=document.getElementById('tv-ov-inner');
  var ORDS=['1ª','2ª','3ª'];
  if(ov.type==='setEnd'){
    var ord=ORDS[(ov.setNum||1)-1]||ov.setNum+'ª';
    inner.innerHTML=
      '<div style="font-size:6rem;line-height:1">🎱</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:clamp(1.4rem,2.5vw,2.2rem);color:#3a6080;text-transform:uppercase;letter-spacing:3px;margin:6px 0">'+ord+' Partida ganada</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:clamp(3rem,6vw,5.5rem);font-weight:900;color:#5badff;line-height:1.05">'+ov.name+'</div>'
      +'<div style="font-size:clamp(1.2rem,2vw,1.8rem);color:#6a8ab0;margin-top:8px">Partidas: '+(ov.sets||[0,0]).join(' – ')+'</div>';
  }else if(ov.type==='encEnd'){
    var sets=ov.sets||[0,0];
    var c0=ov.w===0?'#f5a623':'#5badff', c1=ov.w===1?'#f5a623':'#5badff';
    inner.innerHTML=
      '<div style="font-size:5.5rem;line-height:1">🏆</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:clamp(1.2rem,2vw,2rem);color:#3a6080;text-transform:uppercase;letter-spacing:3px;margin:8px 0 4px">¡Encuentro ganado!</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:clamp(3rem,6vw,5.5rem);font-weight:900;color:#f5a623;line-height:1.05">'+ov.name+'</div>'
      +'<div style="font-size:clamp(.9rem,1.5vw,1.3rem);color:#3a6080;margin-bottom:14px">'+ov.team+'</div>'
      +'<div style="display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);background:rgba(0,0,0,.35);border-radius:16px;padding:clamp(8px,1.2vw,16px) clamp(18px,3vw,40px);margin:0 auto 10px;width:fit-content">'
      +'<span style="font-family:Oswald,sans-serif;font-size:clamp(2.8rem,5.5vw,5rem);font-weight:900;color:'+c0+'">'+sets[0]+'</span>'
      +'<span style="font-family:Oswald,sans-serif;font-size:clamp(1.4rem,2.5vw,2.2rem);color:#3a6080">–</span>'
      +'<span style="font-family:Oswald,sans-serif;font-size:clamp(2.8rem,5.5vw,5rem);font-weight:900;color:'+c1+'">'+sets[1]+'</span>'
      +'</div>'
      +(ov.loserName?'<div style="font-size:clamp(.85rem,1.4vw,1.2rem);color:#ef4444;margin-top:4px">'+ov.loserName+' queda eliminado/a</div>':'');
  }else if(ov.type==='matchEnd'){
    var pts=ov.pts||[0,0];
    var cw='#f5a623', cl='#5badff';
    inner.innerHTML=
      '<div style="font-size:5.5rem;line-height:1">🏅</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:clamp(1.2rem,2vw,2rem);color:#3a6080;text-transform:uppercase;letter-spacing:3px;margin:8px 0 4px">¡Partido ganado!</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:clamp(3rem,6vw,5.5rem);font-weight:900;color:#f5a623;line-height:1.05">'+ov.team+'</div>'
      +'<div style="display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);background:rgba(0,0,0,.35);border-radius:16px;padding:clamp(8px,1.2vw,16px) clamp(18px,3vw,40px);margin:14px auto 6px;width:fit-content">'
      +'<span style="font-family:Oswald,sans-serif;font-size:clamp(2.8rem,5.5vw,5rem);font-weight:900;color:'+cw+'">'+pts[0]+'</span>'
      +'<span style="font-family:Oswald,sans-serif;font-size:clamp(1.4rem,2.5vw,2.2rem);color:#3a6080">–</span>'
      +'<span style="font-family:Oswald,sans-serif;font-size:clamp(2.8rem,5.5vw,5rem);font-weight:900;color:'+cl+'">'+pts[1]+'</span>'
      +'</div>'
      +'<div style="font-size:clamp(.85rem,1.4vw,1.2rem);color:#3a6080;margin-top:4px">encuentros ganados</div>';
  }
  tvOv.style.display='flex';
}

/* ── PEER ── */
function initPeer(){
  var code=Math.floor(100000+Math.random()*900000).toString();
  document.getElementById('wcode').textContent=code;
  var peer=new Peer('chapolin-'+code,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}});
  peer.on('open',function(){
    var folder=window.location.pathname.substring(0,window.location.pathname.lastIndexOf('/')+1);
    var url=window.location.origin+folder+'mando.html?code='+code;
    try{new QRCode(document.getElementById('qrbox'),{text:url,width:200,height:200,colorDark:'#000',colorLight:'#fff'});}catch(e){}
  });
  peer.on('connection',function(conn){
    conn.on('open',function(){
      document.getElementById('wait').style.display='none';
      document.getElementById('game').style.display='flex';
      buildBalls(BDATA.map(function(b){return String(b.id);}));
      setTimer(40,true,40);
    });
    conn.on('data',function(d){
      if(d.type==='state')render(d.state);
      if(d.type==='overlay')showTvOverlay(d.ov||null);
      if(d.type==='ping'){try{conn.send({type:'pong'});}catch(e){}}
    });
  });
}
window.onload=initPeer;
</script>
